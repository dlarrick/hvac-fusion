name: Pull Request Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hvac-crossover
        pip install -r requirements-test.txt

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

    - name: Run pytest
      run: |
        export PYTHONPATH=.:$PYTHONPATH
        python -m pytest tests

  frontend:
    name: Frontend (TypeScript & Bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build bundle
        working-directory: frontend
        run: npx vite build

      - name: Verify committed bundle is up to date
        run: |
          git diff --exit-code custom_components/hvac_fusion/frontend/hvac-fusion-cards.js || {
            echo "::error::Committed bundle is out of sync with frontend/src/. Run 'npm run build' and commit the result."
            exit 1
          }
